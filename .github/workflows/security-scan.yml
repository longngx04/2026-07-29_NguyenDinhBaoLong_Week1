name: Security scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # required for upload-sarif

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and WebGoat submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run static scan
        run: make scan

      - name: Validate raw report format
        run: |
          jq -e 'type == "object" and (.results | type == "array") and (.errors | type == "array")' results/raw/opengrep.json

      - name: Convert to SARIF
        run: python3 scripts/to-sarif.py

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/sarif/opengrep.sarif
          category: opengrep

      - name: Normalize findings
        run: make normalize

      - name: Validate normalized findings
        run: |
          jq -e 'type == "array" and length >= 1 and all(.[]; .tool == "opengrep" and (.severity | type == "string"))' results/normalized/findings.json
          test -s results/normalized/findings.jsonl

      - name: Smoke-test knowledge search
        run: |
          make search Q='SQL Injection'
          make search Q='XSS'

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scan-reports
          if-no-files-found: error
          path: |
            results/raw/opengrep.json
            results/sarif/opengrep.sarif
            results/normalized/findings.json
            results/normalized/findings.jsonl

rules:
  - id: java-command-execution
    languages: [java]
    severity: ERROR
    message: "Potential command injection: Runtime.exec receives a command value. Validate input and avoid invoking a shell with untrusted data."
    metadata:
      category: security
      cwe: "CWE-78"
      owasp: "A03:2021-Injection"
      confidence: MEDIUM
    pattern: Runtime.getRuntime().exec($COMMAND)

  - id: java-sql-statement-execution
    languages: [java]
    severity: ERROR
    message: "Potential SQL injection: a Statement execution method receives a query value. Prefer parameterized PreparedStatement queries."
    metadata:
      category: security
      cwe: "CWE-89"
      owasp: "A03:2021-Injection"
      confidence: MEDIUM
    pattern-either:
      - pattern: $STATEMENT.execute($QUERY)
      - pattern: $STATEMENT.executeQuery($QUERY)
      - pattern: $STATEMENT.executeUpdate($QUERY)

  - id: java-unsafe-deserialization
    languages: [java]
    severity: ERROR
    message: "Potential unsafe deserialization: ObjectInputStream.readObject can deserialize attacker-controlled data. Use a safe format or strict allowlist."
    metadata:
      category: security
      cwe: "CWE-502"
      owasp: "A08:2021-Software-and-Data-Integrity-Failures"
      confidence: MEDIUM
    pattern: $STREAM.readObject()
